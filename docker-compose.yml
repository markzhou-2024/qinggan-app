services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qinggan
      MYSQL_USER: qinggan
      MYSQL_PASSWORD: qinggan
      MYSQL_ROOT_PASSWORD: local-root-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - qinggan-mysql:/var/lib/mysql

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qinggan?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: qinggan
      SPRING_DATASOURCE_PASSWORD: qinggan
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  qinggan-mysql:
