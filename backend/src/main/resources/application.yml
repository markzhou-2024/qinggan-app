spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qinggan}
    username: ${SPRING_DATASOURCE_USERNAME:qinggan}
    password: ${SPRING_DATASOURCE_PASSWORD:qinggan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
qinggan:
  family:
    join-token: ${QINGGAN_FAMILY_JOIN_TOKEN:}
    device-token-signing-secret: ${QINGGAN_DEVICE_TOKEN_SIGNING_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
