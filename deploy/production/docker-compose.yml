services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qinggan
      MYSQL_USER: qinggan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - qinggan-mysql:/var/lib/mysql
    networks:
      - qinggan-internal
    mem_limit: 768m

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qinggan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: qinggan
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:+UseG1GC
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - qinggan-internal
    mem_limit: 768m

volumes:
  qinggan-mysql:

networks:
  qinggan-internal:
    driver: bridge
